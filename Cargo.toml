[package]
name    = "xynq-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow             = "1.0"
base64             = "0.22"
chrono             = "0.4"
clap               = { version = "4.5", features = ["derive"] }
hickory-resolver   = "0.26"
hmac               = { version = "0.13" }
interprocess       = { version = "2.3", features = ["tokio"] }
local-ip-address   = "0.6"
mdns-sd            = "0.19"
pkcs8              = "0.11"
postcard           = { version = "1.1", features = ["alloc", "postcard-derive"] }
prost              = "0.14"
quinn              = "0.11"
rand               = "0.10"
rustls             = "0.23"
serde              = { version = "1.0", features = ["rc", "serde_derive"] }
serde_json         = "1.0"
sha2               = { version = "0.11" }
tokio              = { version = "1.49", features = ["full"] }
tokio-util         = "0.7"
tracing            = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid               = { version = "1.23", features = ["serde", "v4", "v7"] }
x509-parser        = "0.18"
xynq-proto         = { git = "https://github.com/xynq-devs/xynq-proto", branch = "main" }
